<!doctype html>
<html lang="en" data-theme="neo-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · NEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <link

      rel="stylesheet"

      rel="stylesheet"

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans:
          Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', monospace;

        --color-base-100: #ffffff;
        --color-base-200: #f3f4f6;
        --color-base-300: #e5e7eb;
        --color-base-content: #111827;

        --color-background: #ffffff;
        --color-background-secondary: #f9fafb;
        --color-surface: #ffffff;
        --color-surface-raised: #f9fafb;
        --color-border: #e5e7eb;
        --color-border-light: #f3f4f6;
        --color-border-strong: #d1d5db;

        --color-text-primary: #111827;
        --color-text-secondary: #6b7280;
        --color-text-tertiary: #9ca3af;
        --color-text-inverse: #ffffff;

        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-primary-active: #1e40af;
        --color-primary-content: #ffffff;
        --color-primary-muted: #eff6ff;

        --color-success: #10b981;
        --color-success-bg: #d1fae5;
        --color-success-fg: #047857;
        --color-error: #ef4444;
        --color-error-bg: #fee2e2;
        --color-error-fg: #b91c1c;
        --color-warning: #f59e0b;
        --color-warning-bg: #fef3c7;
        --color-warning-fg: #92400e;
        --color-info: #3b82f6;
        --color-info-bg: #dbeafe;
        --color-info-fg: #1d4ed8;
        --color-focus-ring: #2563eb;
      }
    </style>
    <style>
      .icon {
        display: inline-block;
        line-height: 1;
        vertical-align: -0.125em;
      }
      .icon-xs {
        font-size: 16px;
      }
      .icon-sm {
        font-size: 20px;
      }
      .icon-md {
        font-size: 24px;
      }
      .icon-lg {
        font-size: 32px;
      }
      .icon-xl {
        font-size: 48px;
      }
      [data-theme='neo-dark'] .logo-light { display: none; }
      [data-theme='neo-light'] .logo-dark { display: none; }
      [data-theme='neo-light'] {
        color-scheme: light;
        --color-base-100: #ffffff;
        --color-base-200: #f3f4f6;
        --color-base-300: #e5e7eb;
        --color-base-content: #111827;
        --color-primary: #2563eb;
        --color-primary-content: #ffffff;
        --color-secondary: #6b7280;
        --color-secondary-content: #ffffff;
        --color-accent: #2563eb;
        --color-accent-content: #ffffff;
        --color-neutral: #111827;
        --color-neutral-content: #ffffff;
        --color-info: #3b82f6;
        --color-info-content: #ffffff;
        --color-success: #10b981;
        --color-success-content: #ffffff;
        --color-warning: #f59e0b;
        --color-warning-content: #111827;
        --color-error: #ef4444;
        --color-error-content: #ffffff;
        --color-background: #ffffff;
        --color-background-secondary: #f9fafb;
        --color-surface: #ffffff;
        --color-surface-raised: #f9fafb;
        --color-border: #e5e7eb;
        --color-border-light: #f3f4f6;
        --color-border-strong: #d1d5db;
        --color-text-primary: #111827;
        --color-text-secondary: #6b7280;
        --color-text-tertiary: #9ca3af;
        --color-text-inverse: #ffffff;
        --color-primary-hover: #1d4ed8;
        --color-primary-active: #1e40af;
        --color-primary-muted: #eff6ff;
        --color-success-bg: #d1fae5;
        --color-success-fg: #047857;
        --color-error-bg: #fee2e2;
        --color-error-fg: #b91c1c;
        --color-warning-bg: #fef3c7;
        --color-warning-fg: #92400e;
        --color-info-bg: #dbeafe;
        --color-info-fg: #1d4ed8;
        --color-focus-ring: #2563eb;
        --radius-selector: 9999px;
        --radius-field: 9999px;
        --radius-box: 0.5rem;
        --size-selector: 0.25rem;
        --size-field: 0.25rem;
      }
      [data-theme='neo-dark'] {
        color-scheme: dark;
        --color-base-100: #111827;
        --color-base-200: #1f2937;
        --color-base-300: #374151;
        --color-base-content: #f9fafb;
        --color-primary: #3b82f6;
        --color-primary-content: #0b1220;
        --color-secondary: #d1d5db;
        --color-secondary-content: #0b1220;
        --color-accent: #3b82f6;
        --color-accent-content: #0b1220;
        --color-neutral: #1f2937;
        --color-neutral-content: #f9fafb;
        --color-info: #60a5fa;
        --color-info-content: #0b1220;
        --color-success: #34d399;
        --color-success-content: #0b1220;
        --color-warning: #fbbf24;
        --color-warning-content: #0b1220;
        --color-error: #f87171;
        --color-error-content: #0b1220;
        --color-background: #0b1220;
        --color-background-secondary: #111827;
        --color-surface: #111827;
        --color-surface-raised: #1f2937;
        --color-border: #374151;
        --color-border-light: #1f2937;
        --color-border-strong: #4b5563;
        --color-text-primary: #f9fafb;
        --color-text-secondary: #d1d5db;
        --color-text-tertiary: #9ca3af;
        --color-text-inverse: #0b1220;
        --color-primary-hover: #60a5fa;
        --color-primary-active: #2563eb;
        --color-primary-muted: #172554;
        --color-success-bg: #064e3b;
        --color-success-fg: #6ee7b7;
        --color-error-bg: #450a0a;
        --color-error-fg: #fca5a5;
        --color-warning-bg: #451a03;
        --color-warning-fg: #fcd34d;
        --color-info-bg: #172554;
        --color-info-fg: #93c5fd;
        --color-focus-ring: #3b82f6;
        --radius-selector: 9999px;
        --radius-field: 9999px;
        --radius-box: 0.5rem;
        --size-selector: 0.25rem;
        --size-field: 0.25rem;
      }
      body {
        background-color: var(--color-background);
        color: var(--color-text-primary);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      :focus-visible {
        outline: 2px solid var(--color-focus-ring);
        outline-offset: 2px;
      }
      .theme-switcher {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 60;
        display: flex;
        gap: 0.25rem;
        padding: 0.25rem;
        border-radius: 999px;
        border: 1px solid var(--color-base-300);
        background: var(--color-base-100);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .theme-switcher button {
        font: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 0;
        background: transparent;
        color: var(--color-base-content);
        opacity: 0.65;
        cursor: pointer;
      }
      .theme-switcher button[aria-pressed='true'] {
        background: var(--color-base-200);
        opacity: 1;
        .btn {
          border-radius: 9999px !important;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = window.localStorage.getItem('neo-theme');
          if (t !== 'neo-light' && t !== 'neo-dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'neo-dark'
              : 'neo-light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary min-h-screen">
    <div class="theme-switcher" role="group" aria-label="Colour theme">
      <button type="button" data-theme-value="neo-light" aria-pressed="true">
        Light
      </button>
      <button type="button" data-theme-value="neo-dark" aria-pressed="false">
        Dark
      </button>
    </div>
    <script>
      (function () {
        var key = 'neo-theme';
        function apply(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          Array.prototype.forEach.call(
            document.querySelectorAll('.theme-switcher button'),
            function (button) {
              button.setAttribute(
                'aria-pressed',
                String(button.getAttribute('data-theme-value') === theme)
              );
            }
          );
        }
        apply(
          document.documentElement.getAttribute('data-theme') || 'neo-light'
        );
        Array.prototype.forEach.call(
          document.querySelectorAll('.theme-switcher button'),
          function (button) {
            button.addEventListener('click', function () {
              var theme = button.getAttribute('data-theme-value');
              try {
                window.localStorage.setItem(key, theme);
              } catch (error) {}
              apply(theme);
            });
          }
        );
      })();
    </script>

    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <div class="w-full max-w-sm">
        <a href="01-landing.html" class="mb-6 flex items-center gap-2"
          ><img src="../../brand/svg/logo-mark-light.svg" alt="" aria-hidden="true" class="logo-light h-6 w-6" /><img src="../../brand/svg/logo-mark-dark.svg" alt="" aria-hidden="true" class="logo-dark h-6 w-6" /><span class="text-text-primary text-lg font-semibold tracking-tight">NEO</span></a
        >
        <div class="bg-surface border-border rounded-xl border p-6 shadow-sm">
          <h1 class="text-text-primary text-xl font-semibold">
            Sign in to NEO
          </h1>
          <p class="text-text-secondary mt-1 text-sm">
            Welcome back. Enter your details to continue.
          </p>

          <form class="mt-6 flex flex-col gap-4" novalidate>
            <div class="flex flex-col gap-1.5">
              <label for="email" class="text-text-primary text-sm font-medium"
                >Email address</label
              >
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="you@example.com"
                class="input w-full" />
            </div>
            <div class="flex flex-col gap-1.5">
              <div class="flex items-center justify-between">
                <label
                  for="password"
                  class="text-text-primary text-sm font-medium"
                  >Password</label
                >
                <a
                  href="#"
                  class="text-primary text-xs font-medium hover:underline"
                  >Forgot password?</a
                >
              </div>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Your password"
                class="input w-full" />
            </div>
            <button type="submit" class="btn btn-primary btn-md mt-2 w-full">
              Sign in
            </button>
          </form>

          <p class="text-text-secondary mt-6 text-center text-sm">
            Don&rsquo;t have an account?
            <a
              href="03-register.html"
              class="text-primary font-medium hover:underline"
              >Create one</a
            >
          </p>
        </div>

        <p class="text-text-tertiary mt-4 text-center text-xs">
          Prototype only &middot; do not enter real credentials.
        </p>
      </div>
    </main>
  </body>
</html>
