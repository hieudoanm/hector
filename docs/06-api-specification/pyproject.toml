[project]
name = "neo-bank-api"
version = "0.1.0"
description = "Neo Bank OpenAPI conversion tooling"
requires-python = "==3.15.2"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["docs/06-api-specification"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "DTZ", "PLC", "TRY"]
fixable = ["F", "I"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
