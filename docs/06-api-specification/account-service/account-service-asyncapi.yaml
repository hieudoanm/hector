asyncapi: 2.6.0
info:
  title: NEO Bank — Account Service (Async Command & Event API)
  version: 1.0.0
  description: |
    The Account Service is the command-side processor for balance changes. It
    owns `account_keyspace.accounts` and is the only service that mutates a
    balance. As part of the transfer saga it consumes debit/credit commands
    from the `transfers` topic and emits the matching result event. Commands
    and events are keyed by source account ID so every movement for one account
    stays ordered.

    This is the async counterpart to `account-service-openapi.yaml`: the REST
    file covers the balance read endpoint; this file covers the saga commands
    the service consumes and the events it produces. There is no public HTTP
    command endpoint — balance mutations never run inside a web request handler.
servers:
  local:
    url: kafka://localhost:29092
    protocol: kafka
    description: Single-broker ZooKeeper-mode Kafka from `docker-compose.yaml` (RF=1); `29092` is the external listener for host clients
  production:
    url: kafka://kafka.neo.bank:9092
    protocol: kafka
    description: Multi-AZ Kafka (RF=3, min.insync.replicas=2)
defaultContentType: application/json
channels:
  transfers:
    description: |
      Saga command/event topic (`transfers`), keyed by source account ID.
      The Account Service consumes `account.debit.requested` and
      `account.credit.requested`, and produces `account.debited`,
      `account.debit.failed`, `account.credited`, and `account.credit.failed`.
      Non-retryable failures are routed to `transfers.dlq`.
    subscribe:
      operationId: onBalanceCommand
      summary: Consume a debit or credit command issued by the Transfer Service
      description: |
        Each command is applied idempotently against the recorded
        `idempotency_key`; a redelivered command must not move funds twice.
        Debits are conditional (paxos) so a balance can never go negative.
      message:
        oneOf:
          - $ref: '#/components/messages/AccountDebitRequested'
          - $ref: '#/components/messages/AccountCreditRequested'
    publish:
      operationId: emitBalanceResult
      summary: Emit the outcome of a debit or credit command back to the saga
      message:
        oneOf:
          - $ref: '#/components/messages/AccountDebited'
          - $ref: '#/components/messages/AccountDebitFailed'
          - $ref: '#/components/messages/AccountCredited'
          - $ref: '#/components/messages/AccountCreditFailed'
components:
  messages:
    AccountDebitRequested:
      name: account.debit.requested
      title: Debit requested
      summary: Transfer Service asks the Account Service to debit an account.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BalanceCommand'
    AccountCreditRequested:
      name: account.credit.requested
      title: Credit requested
      summary: Transfer Service asks the Account Service to credit an account (used for the destination credit and for the source reversal/compensation).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BalanceCommand'
    AccountDebited:
      name: account.debited
      title: Account debited
      summary: The debit succeeded.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BalanceResult'
    AccountDebitFailed:
      name: account.debit.failed
      title: Account debit failed
      summary: The debit failed (for example insufficient funds).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BalanceResult'
    AccountCredited:
      name: account.credited
      title: Account credited
      summary: The credit succeeded.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BalanceResult'
    AccountCreditFailed:
      name: account.credit.failed
      title: Account credit failed
      summary: The credit failed; the saga triggers compensation.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BalanceResult'
  schemas:
    BalanceCommand:
      type: object
      description: A debit or credit command. The command type is carried in `eventType`.
      properties:
        eventId:
          type: string
          format: uuid
          description: UUID v7 identifying this message.
        eventType:
          type: string
          enum:
            - account.debit.requested
            - account.credit.requested
        eventVersion:
          type: integer
          minimum: 1
        transferId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          description: The account to debit or credit.
        amountCents:
          type: integer
          minimum: 1
          maximum: 9999999999
          description: Amount in minor units (cents); always positive.
        idempotencyKey:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,255}$'
          description: Command idempotency key; scoped to this transfer and account movement.
        correlationId:
          type: string
          format: uuid
          description: Transfer-level correlation identifier.
        causationId:
          type: string
          format: uuid
          description: The `eventId` that directly caused this command.
        requestedAt:
          type: string
          format: date-time
      required:
        - eventId
        - eventType
        - eventVersion
        - transferId
        - accountId
        - amountCents
        - idempotencyKey
        - correlationId
        - requestedAt
    BalanceResult:
      type: object
      description: The outcome of a debit or credit command. The outcome is carried in `eventType`.
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - account.debited
            - account.debit.failed
            - account.credited
            - account.credit.failed
        eventVersion:
          type: integer
          minimum: 1
        transferId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
        balanceCents:
          type: integer
          minimum: 0
          description: Resulting balance when the movement succeeded.
        failureReason:
          type: string
          nullable: true
          description: Present when the movement failed (for example `INSUFFICIENT_FUNDS`).
        idempotencyKey:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,255}$'
        correlationId:
          type: string
          format: uuid
        causationId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
      required:
        - eventId
        - eventType
        - eventVersion
        - transferId
        - accountId
        - amountCents
        - idempotencyKey
        - correlationId
        - occurredAt
