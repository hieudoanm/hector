openapi: 3.0.3
info:
  title: NEO Bank — Account Service
  version: 1.0.0
  description: |
    Account Service. Manages accounts and balances. Validates account
    existence/ownership, serves balance, executes debit/credit operations
    as part of the saga, and enforces non-negative balances. Owns accounts data.

    This REST file covers the balance read endpoint only. The saga
    debit/credit commands the service consumes and the result events it
    produces are specified in the companion AsyncAPI file
    `account-service-asyncapi.yaml`.
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.neo.bank/api/v1
    description: Production server
paths:
  /accounts/{accountId}/balance:
    get:
      summary: Get account balance
      operationId: getAccountBalance
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: accountId
          required: true
          description: ID of the account
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    AccountBalance:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: UUID v7
        balanceCents:
          type: integer
          minimum: 0
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code
        updatedAt:
          type: string
          format: date-time
      required: [accountId, balanceCents, currencyCode, updatedAt]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
              format: uuid
          required: [code, message, requestId]
  headers:
    X-Request-ID:
      description: Unique identifier for the request
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Error response
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'