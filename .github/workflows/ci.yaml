name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cli-build:
    name: CLI - Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hector
          path: packages/cli/target/release/hector
          if-no-files-found: error

  cli-release:
    name: CLI - Release
    needs: [cli-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download Build Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: hector
          path: artifacts

      - name: Publish Release
        run: |
          RELEASE_NAME="hector-latest"
          RELEASE_TITLE="hector (latest)"
          NOTES_FILE="README.md"
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built from commit ${{ github.sha }}"
            if [[ -f "$NOTES_FILE" ]]; then
              echo ""
              echo "---"
              echo ""
              cat "$NOTES_FILE"
            fi
          } > "$RELEASE_NOTES"
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            artifacts/hector
        env:
          GH_TOKEN: ${{ github.token }}

  web-build:
    name: Web - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.15.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Upload web out artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-out
          path: packages/web/out
          retention-days: 1

  web-tauri:
    name: Web - Build Tauri (${{ matrix.os }})
    needs: [web-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.15.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: "pnpm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/web/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/web/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev rpm

      - name: Install dependencies
        working-directory: packages/web
        run: pnpm install

      - name: Download web out artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-out
          path: packages/web/out

      - name: Build Tauri
        working-directory: packages/web
        run: pnpm run tauri:build

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-release-${{ matrix.os }}
          path: packages/web/src-tauri/target/release/bundle
          retention-days: 1

  web-release:
    name: Web - Release
    needs: [web-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all Tauri bundles
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: web-release-*
          merge-multiple: true
          path: bundles

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete web-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create web-latest --title "Hector Web (latest)" --notes-file README.md --prerelease=false

      - name: Upload bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find bundles -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -exec gh release upload web-latest {} --clobber \;
