name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hector
          path: packages/cli/target/release/hector
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    needs: [cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
      - name: Download Build Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: hector
          path: artifacts
      - name: Publish Release
        run: |
          gh release delete hector-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create hector-latest artifacts/hector \
            --title "hector (latest)" \
            --notes "Auto-built from commit ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
