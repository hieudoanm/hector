name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/vectors-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features eval

      - name: Build
        run: cargo build --release --locked

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vectors
          path: crates/target/release/vectors
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: CLI (latest)
          body_path: crates/vectors-cli/README.md
          files: crates/target/release/vectors

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: "12.16.1"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build vectors-core (wasm)
        working-directory: crates/vectors-core
        run: |
          cargo build --locked --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          wasm-bindgen --target web --out-dir ../../packages/web/node_modules/@vectors/core/pkg ../target/wasm32-unknown-unknown/debug/vectors.wasm || true

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/web/out
          retention-days: 1

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v5.0.1
