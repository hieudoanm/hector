[package]
name = "hector-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "Raster to vector image tracer: PNG/JPG in, SVG out"
license = "MIT"
readme = "README.md"

[lib]
name = "hector_cli"
path = "src/lib.rs"

[[bin]]
name = "hector"
path = "src/bin/hector.rs"

[features]
default = []
# The render-and-compare harness, and the subcommands that drive it. Off by
# default so the tracer binary never links the measurement code.
eval = []

[dependencies]
hector = { path = "../module", features = ["raster"] }
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["multipart"] }
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "=0.7.1", features = ["cors", "limit", "trace"] }

[dev-dependencies]
http-body-util = "=0.1.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
