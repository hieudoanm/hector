[package]
name = "hector"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "Raster to vector image tracer core"
license = "MIT"

[lib]
name = "hector"
path = "src/lib.rs"

[features]
default = []
eval = ["dep:resvg"]

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["multipart"] }
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "=0.49.0", default-features = false, optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "=0.7.1", features = ["cors", "limit", "trace"] }
